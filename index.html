<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner de Dios</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#4e54c8,#8f94fb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:850px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
color:#4e54c8;
margin-bottom:15px;
font-size:2.5rem;
}

#timer{
font-size:32px;
font-weight:bold;
color:#e74c3c;
margin-bottom:20px;
}

#pregunta{
font-size:1.5rem;
font-weight:bold;
min-height:140px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:15px;
}

button{
border:none;
padding:15px 30px;
margin:10px;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.si{
background:#2ecc71;
color:white;
}

.no{
background:#e74c3c;
color:white;
}

.comenzar{
background:#3498db;
color:white;
}

#btnSi,
#btnNo{
display:none;
}

#resultado{
margin-top:15px;
font-size:1.4rem;
font-weight:bold;
min-height:50px;
}

#puntaje{
margin-top:10px;
font-size:1.3rem;
font-weight:bold;
color:#f39c12;
}

.versiculo{
margin-top:25px;
padding:15px;
background:#f5f5f5;
border-radius:10px;
font-style:italic;
}

.animar{
animation:entrada .5s ease;
}

@keyframes entrada{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="container">

<h1>👑 Hijos de Dios</h1>

<div id="timer">
⏰ Tiempo: 05:00
</div>

<div id="pregunta">

👋 Bienvenido al Scanner de Dios

<br><br>

Responde las preguntas antes de que termine el tiempo.

<br><br>

Presiona COMENZAR.

</div>

<button id="btnComenzar" class="comenzar" onclick="siguientePregunta()">
🚀 Comenzar
</button>

<br>

<button id="btnSi" class="si" onclick="responder(true)">
🟢 SÍ PASA
</button>

<button id="btnNo" class="no" onclick="responder(false)">
🔴 NO PASA
</button>

<div id="resultado"></div>

<div id="puntaje">
🏆 Puntaje: 0
</div>

<div class="versiculo">
Romanos 8:15<br>
"Han recibido el Espíritu de adopción, por el cual clamamos:
¡Abba, Padre!"
</div>

</div>

<script>

const preguntas = [

{texto:"Ayudar a un compañero que lo necesita",respuesta:true},
{texto:"Mentir para evitar un castigo",respuesta:false},
{texto:"Orar antes de dormir",respuesta:true},
{texto:"Burlarse de otra persona",respuesta:false},
{texto:"Obedecer a los padres",respuesta:true},
{texto:"Golpear a un compañero",respuesta:false},
{texto:"Compartir con los demás",respuesta:true},
{texto:"Decir palabras ofensivas",respuesta:false},
{texto:"Dar gracias a Dios",respuesta:true},
{texto:"Hacer trampa para ganar",respuesta:false},
{texto:"Perdonar a quien me ofendió",respuesta:true},
{texto:"Ayudar en casa sin que me lo pidan",respuesta:true}

];

let actual = null;
let puntos = 0;
let preguntaActual = 0;
let yaRespondio = false;

let preguntasDisponibles = [...preguntas];

let tiempoRestante = 300;
let temporizadorIniciado = false;
let juegoTerminado = false;

function iniciarTemporizador(){

if(temporizadorIniciado) return;

temporizadorIniciado = true;

const intervalo = setInterval(()=>{

if(juegoTerminado){

clearInterval(intervalo);
return;

}

tiempoRestante--;

const minutos =
Math.floor(tiempoRestante / 60);

const segundos =
tiempoRestante % 60;

document.getElementById("timer").innerHTML =
`⏰ Tiempo: ${String(minutos).padStart(2,"0")}:${String(segundos).padStart(2,"0")}`;

if(tiempoRestante <= 0){

finalizarJuego();
clearInterval(intervalo);

}

},1000);

}

function finalizarJuego(){

juegoTerminado = true;

document.getElementById("pregunta").innerHTML = `
⏰ ¡Tiempo terminado!
<br><br>
🏆 Puntaje Final: ${puntos} de ${preguntas.length}
<br><br>
📸 Toma una captura de pantalla y envíala por el chat de Teams.
`;

document.getElementById("btnSi").style.display="none";
document.getElementById("btnNo").style.display="none";
document.getElementById("btnComenzar").style.display="none";

let medalla = "";

if(puntos >= 10){

medalla = "🥇 MEDALLA DE ORO";

}else if(puntos >= 6){

medalla = "🥈 MEDALLA DE PLATA";

}else{

medalla = "🥉 MEDALLA DE BRONCE";

}

document.getElementById("resultado").innerHTML =
medalla;

}

function siguientePregunta(){

if(juegoTerminado) return;

iniciarTemporizador();

if(preguntaActual >= preguntas.length){

finalizarJuego();
return;

}

document.getElementById("btnComenzar").style.display="none";

document.getElementById("btnSi").style.display=
"inline-block";

document.getElementById("btnNo").style.display=
"inline-block";

document.getElementById("resultado").innerHTML="";
yaRespondio=false;

const indice =
Math.floor(Math.random()*preguntasDisponibles.length);

actual = preguntasDisponibles[indice];

preguntasDisponibles.splice(indice,1);

preguntaActual++;

const preguntaDiv =
document.getElementById("pregunta");

preguntaDiv.classList.remove("animar");

setTimeout(()=>{

preguntaDiv.innerHTML=`
📖 Pregunta ${preguntaActual} de ${preguntas.length}
<br><br>
${actual.texto}
`;

preguntaDiv.classList.add("animar");

},50);

}

function responder(valor){

if(actual===null ||
yaRespondio ||
juegoTerminado){
return;
}

yaRespondio=true;

if(valor===actual.respuesta){

document.getElementById("resultado").innerHTML=
"✅ ¡Correcto!";

puntos++;

}else{

document.getElementById("resultado").innerHTML=
"❌ Incorrecto";

}

document.getElementById("puntaje").innerHTML=
"🏆 Puntaje: " + puntos;

document.getElementById("btnSi").style.display=
"none";

document.getElementById("btnNo").style.display=
"none";

document.getElementById("btnComenzar").style.display=
"inline-block";

if(preguntaActual < preguntas.length){

document.getElementById("btnComenzar").innerHTML=
"➡️ Siguiente Pregunta";

}else{

document.getElementById("btnComenzar").innerHTML=
"🏁 Ver Resultado";

}

}

</script>

</body>
</html>
